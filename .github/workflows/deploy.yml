name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 119.59.102.235
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            APP=/home/pcj/domains/paekarn.com/paekarnv2
            PUBLIC_HTML=/home/pcj/domains/paekarn.com/public_html

            echo "=== git pull ==="
            cd $APP && git pull origin main

            echo "=== build CSS ==="
            npm run build:css

            echo "=== sync public/ -> public_html/ ==="
            rsync -av --exclude='.htaccess' --exclude='uploads/' $APP/public/ $PUBLIC_HTML/

            echo "=== fix permissions ==="
            chown -R pcj:pcj $PUBLIC_HTML
            chown -R pcj:pcj $APP/storage $APP/public/uploads

            echo "=== Deploy complete ==="
            date
