name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build CSS
        run: npm ci && npm run build:css

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='public/uploads/' \
            --exclude='storage/' \
            --exclude='.env' \
            --exclude='app/Config/app.local.php' \
            --exclude='app/Config/database.local.php' \
            --exclude='scripts/dump_safe.sql' \
            ./ deploy/

      - name: Upload to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -m 600 -D /dev/stdin ~/.ssh/deploy_key <<< "$SSH_KEY"
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            deploy/ "$VPS_USER@$VPS_HOST:/tmp/paekarn-deploy-src/"

      - name: Install on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -e
            APP="${{ secrets.VPS_APP_DIR }}"
            PUBLIC_HTML="${{ secrets.VPS_PUBLIC_HTML }}"
            FILE_OWNER="${{ secrets.VPS_FILE_OWNER }}"
            export DB_NAME="${{ secrets.VPS_DB_NAME }}"
            export DB_USER="${{ secrets.VPS_DB_USER }}"
            export DB_PASS="${{ secrets.VPS_DB_PASS }}"
            SRC=/tmp/paekarn-deploy-src

            CANONICAL_APP="/home/pcj/domains/paekan.com/paekarnv2"
            CANONICAL_PUBLIC="/home/pcj/domains/paekan.com/public_html"

            if [ -z "$DB_NAME" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASS" ]; then
              echo "Missing VPS_DB_NAME, VPS_DB_USER, or VPS_DB_PASS secret"
              exit 1
            fi
            if [ -z "$FILE_OWNER" ]; then
              FILE_OWNER="$(whoami)"
            fi

            echo "=== move app to paekan.com (one-time) ==="
            if [ -f "$SRC/scripts/move-app-to-paekan.sh" ]; then
              bash "$SRC/scripts/move-app-to-paekan.sh" || echo "WARN: move-app-to-paekan failed"
            fi

            if [ -d "$CANONICAL_APP/app" ]; then
              APP="$CANONICAL_APP"
              PUBLIC_HTML="$CANONICAL_PUBLIC"
              echo "Using canonical paths: APP=$APP PUBLIC_HTML=$PUBLIC_HTML"
            fi

            if [ -z "$APP" ] || [ -z "$PUBLIC_HTML" ]; then
              echo "Missing VPS_APP_DIR or VPS_PUBLIC_HTML secret (and canonical app not found)"
              exit 1
            fi

            echo "=== sync app files ==="
            rsync -av \
              --exclude='public/uploads/' \
              --exclude='app/Config/database.php' \
              --exclude='app/Config/app.local.php' \
              --exclude='app/Config/database.local.php' \
              "$SRC/" "$APP/"

            echo "=== sync public_html (exclude entrypoints managed separately) ==="
            rsync -av \
              --exclude='uploads/' \
              --exclude='.htaccess' \
              --exclude='index.php' \
              --exclude='install.php' \
              --exclude='cron.php' \
              "$APP/public/" "$PUBLIC_HTML/"

            echo "=== ensure public_html/index.php + .htaccess ==="
            {
              echo '<?php'
              echo 'declare(strict_types=1);'
              echo "define('APP_BASE', '$APP');"
              echo "require_once APP_BASE . '/app/Core/Application.php';"
              echo '\App\Core\Application::boot(APP_BASE);'
              echo '\App\Core\Application::run();'
            } > "$PUBLIC_HTML/index.php"
            if [ -f "$APP/public/.htaccess" ]; then
              cp "$APP/public/.htaccess" "$PUBLIC_HTML/.htaccess"
            fi

            echo "=== permissions + sync uploads to public_html ==="
            mkdir -p "$APP/storage/cache" "$APP/storage/backups" "$APP/public/uploads"
            mkdir -p "$PUBLIC_HTML/uploads"
            if [ -L "$PUBLIC_HTML/uploads" ]; then
              rm -f "$PUBLIC_HTML/uploads"
              mkdir -p "$PUBLIC_HTML/uploads"
            elif [ -d "$PUBLIC_HTML/uploads" ] && [ ! -L "$PUBLIC_HTML/uploads" ]; then
              :
            else
              mkdir -p "$PUBLIC_HTML/uploads"
            fi
            rsync -av "$APP/public/uploads/" "$PUBLIC_HTML/uploads/"
            UPLOAD_COUNT="$(find "$APP/public/uploads" -type f 2>/dev/null | wc -l | tr -d ' ')"
            echo "  upload files synced: $UPLOAD_COUNT"
            rm -f "$APP/storage/cache/pages/"*.cache 2>/dev/null || true
            chown -R "$FILE_OWNER:$FILE_OWNER" "$PUBLIC_HTML" "$APP/storage" "$APP/public/uploads"
            chmod -R 775 "$APP/storage" "$APP/public/uploads"

            echo "=== run DB migrations ==="
            if [ -f "$APP/scripts/migrate_owner_manual_booking.sh" ]; then
              bash "$APP/scripts/migrate_owner_manual_booking.sh" || echo "WARN: migrate_owner_manual_booking failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_line_contact_phone.sh" ]; then
              bash "$APP/scripts/migrate_line_contact_phone.sh" || echo "WARN: migrate_line_contact_phone failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_analytics.sh" ]; then
              bash "$APP/scripts/migrate_analytics.sh" || echo "WARN: migrate_analytics failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_line_crm_tags.sh" ]; then
              bash "$APP/scripts/migrate_line_crm_tags.sh" || echo "WARN: migrate_line_crm_tags failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_message_templates.sh" ]; then
              bash "$APP/scripts/migrate_message_templates.sh" || echo "WARN: migrate_message_templates failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_message_queue.sh" ]; then
              bash "$APP/scripts/migrate_message_queue.sh" || echo "WARN: migrate_message_queue failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_marketing_tables.sh" ]; then
              bash "$APP/scripts/migrate_marketing_tables.sh" || echo "WARN: migrate_marketing_tables failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_password_reset.sh" ]; then
              bash "$APP/scripts/migrate_password_reset.sh" || echo "WARN: migrate_password_reset failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_vps.sh" ]; then
              bash "$APP/scripts/migrate_vps.sh" || echo "WARN: migrate_vps failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_owner_property_limit.sh" ]; then
              bash "$APP/scripts/migrate_owner_property_limit.sh" || echo "WARN: migrate_owner_property_limit failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_domain_settings.sh" ]; then
              bash "$APP/scripts/migrate_domain_settings.sh" || echo "WARN: migrate_domain_settings failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_stripe_coupon_orders.sh" ]; then
              bash "$APP/scripts/migrate_stripe_coupon_orders.sh" || echo "WARN: migrate_stripe_coupon_orders failed (may already be applied)"
            fi
            if [ -f "$APP/scripts/migrate_owner_membership_perks.sh" ]; then
              bash "$APP/scripts/migrate_owner_membership_perks.sh" || echo "WARN: migrate_owner_membership_perks failed (may already be applied)"
            fi

            echo "=== cleanup ==="
            rm -rf "$SRC"

            echo "=== Deploy complete ==="
            date
