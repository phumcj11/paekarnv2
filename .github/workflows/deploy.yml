name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 119.59.102.235
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/paekarn

            echo "=== git pull ==="
            git pull origin main

            echo "=== build CSS ==="
            npm run build:css

            echo "=== reload PHP-FPM ==="
            systemctl reload php8.2-fpm

            echo "=== reload Nginx ==="
            nginx -t && systemctl reload nginx

            echo "=== Deploy complete ==="
            date
